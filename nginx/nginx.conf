# Gateway duy nhất mở ra ngoài (port 80): /api -> todo-api, còn lại -> todo-ui
server {
    listen 80;
    server_name _;

    # DNS nội bộ của Docker. Dùng biến trong proxy_pass để nginx phân giải lại tên service,
    # không giữ IP cũ khi container api/ui được tạo lại (docker compose up --build) -> tránh 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    set $ui_upstream http://ui:80;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $ui_upstream;
        proxy_set_header Host $host;
    }
}
